<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>🍴 Family Food Finder (Mobile & Editable)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
      background: #f5f5f5;
      color: #222;
    }
    h1 { margin-bottom: 0.5em; font-size: 1.5em; text-align: center; }
    label { display: block; margin-top: 0.5em; font-weight: 500; }
    input {
      padding: 5px 8px;
      margin-left: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      width: 100px;
    }
    .table-container {
      overflow-x: auto;
      margin-top: 1em;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 10px;
      background: white;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      table-layout: auto;
      min-width: 600px;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: normal;
    }
    th { background: #fafafa; font-weight: 600; }
    tbody tr:hover { background: #f0f8ff; }
    td:nth-child(5) { width: 200px; } /* Notes column width */

    button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin: 5px 2px 5px 0;
    }
    #addRow { background: #2196f3; color: white; }
    #addRow:hover { background: #1976d2; }
    #clearData { background: #f44336; color: white; }
    #clearData:hover { background: #d32f2f; }
    .deleteBtn { background: #ff6666; color: white; }
    .deleteBtn:hover { background: #cc0000; }

    @media (max-width: 450px) {
      #addRow, #clearData { width: 100%; margin-bottom: 5px; }
      input { width: 90px; }
    }
  </style>
</head>
<body>
  <h1>🍴 Family Food Finder</h1>

  <section id="filters">
    <label>Min Price ($): <input type="number" id="minPrice" value="0"></label>
    <label>Max Price ($): <input type="number" id="maxPrice" value="100"></label>
    <label>Max Distance (mi): <input type="number" id="maxDistance" value="10"></label>
  </section>

  <div class="table-container">
    <table id="restaurantTable">
      <thead>
        <tr>
          <th>Restaurant</th>
          <th>Type</th>
          <th>Distance</th>
          <th>Price</th>
          <th>Notes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td contenteditable="true">Taco Town</td>
          <td contenteditable="true">Mexican</td>
          <td contenteditable="true">2.3</td>
          <td contenteditable="true">15</td>
          <td contenteditable="true">Quick dinner</td>
          <td><button class="deleteBtn">🗑️ Delete</button></td>
        </tr>
        <tr>
          <td contenteditable="true">Fancy Steakhouse</td>
          <td contenteditable="true">Steak</td>
          <td contenteditable="true">5.8</td>
          <td contenteditable="true">65</td>
          <td contenteditable="true">Birthday spot</td>
          <td><button class="deleteBtn">🗑️ Delete</button></td>
        </tr>
        <tr>
          <td contenteditable="true">Pasta Palace</td>
          <td contenteditable="true">Italian</td>
          <td contenteditable="true">3.2</td>
          <td contenteditable="true">25</td>
          <td contenteditable="true">Family favorite</td>
          <td><button class="deleteBtn">🗑️ Delete</button></td>
        </tr>
        <tr>
          <td contenteditable="true">Burger Barn</td>
          <td contenteditable="true">American</td>
          <td contenteditable="true">1.1</td>
          <td contenteditable="true">12</td>
          <td contenteditable="true">Close & cheap</td>
          <td><button class="deleteBtn">🗑️ Delete</button></td>
        </tr>
        <tr>
          <td contenteditable="true">Sushi Spot</td>
          <td contenteditable="true">Japanese</td>
          <td contenteditable="true">5.4</td>
          <td contenteditable="true">40</td>
          <td contenteditable="true">Date night</td>
          <td><button class="deleteBtn">🗑️ Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <button id="addRow">➕ Add Restaurant</button>
  <button id="clearData">🗑️ Clear All Saved Data</button>

  <script>
    const tableBody = document.querySelector("#restaurantTable tbody");
    const minInput = document.getElementById("minPrice");
    const maxInput = document.getElementById("maxPrice");
    const distInput = document.getElementById("maxDistance");

    window.addEventListener("load", () => {
      const saved = localStorage.getItem("familyFoodFinderData");
      if (saved) tableBody.innerHTML = saved;
      attachDeleteButtons();
      filter();
    });

    function saveData() {
      localStorage.setItem("familyFoodFinderData", tableBody.innerHTML);
    }

    tableBody.addEventListener("input", saveData);

    document.getElementById("addRow").addEventListener("click", () => {
      const newRow = document.createElement("tr");
      newRow.innerHTML = `<td contenteditable="true"></td>
                          <td contenteditable="true"></td>
                          <td contenteditable="true"></td>
                          <td contenteditable="true"></td>
                          <td contenteditable="true"></td>
                          <td><button class="deleteBtn">🗑️ Delete</button></td>`;
      tableBody.appendChild(newRow);
      attachDeleteButtons();
      saveData();
    });

    document.getElementById("clearData").addEventListener("click", () => {
      if (confirm("Are you sure you want to delete all saved data?")) {
        localStorage.removeItem("familyFoodFinderData");
        location.reload();
      }
    });

    function attachDeleteButtons() {
      const buttons = tableBody.querySelectorAll(".deleteBtn");
      buttons.forEach(btn => {
        btn.onclick = () => {
          if (confirm("Are you sure you want to delete this restaurant?")) {
            btn.closest("tr").remove();
            saveData();
          }
        };
      });
    }

    function filter() {
      const min = parseFloat(minInput.value) || 0;
      const max = parseFloat(maxInput.value) || Infinity;
      const dist = parseFloat(distInput.value) || Infinity;

      [...tableBody.rows].forEach(row => {
        const price = parseFloat(row.cells[3].textContent) || 0;
        const distance = parseFloat(row.cells[2].textContent) || 0;
        row.style.display =
          price >= min && price <= max && distance <= dist ? "" : "none";
      });
    }

    [minInput, maxInput, distInput].forEach(i =>
      i.addEventListener("input", filter)
    );
  </script>
</body>
</html>
